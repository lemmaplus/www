<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pilemma</title>
<meta name="theme-color" content="#fffdf8">
<style>
:root {
  --paper:#fffdf8;
  --ink:#171512;
  --accent:#8f3fb0;
  --choice:#55514c;
  --muted:#81786e;
}

* { box-sizing:border-box; }

html, body {
  margin:0;
  min-height:100%;
  background:var(--paper);
}

body {
  min-height:100svh;
  display:grid;
  place-items:center;
  overflow:hidden;
}

.doorway {
  width:min(98vw, 1120px);
  text-align:center;
}

.stage {
  position:relative;
  width:100%;
  aspect-ratio: 3.1 / 1;
  min-height:240px;
  max-height:360px;
}

.logo {
  position:absolute;
  left:50%;
  top:48%;
  width:96%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.logo svg {
  display:block;
  width:100%;
  height:auto;
  fill:var(--ink);
}

/* A large invisible draggable target. */
.portal {
  position:absolute;
  width:54px;
  height:54px;
  margin:-27px 0 0 -27px;
  border:0;
  padding:0;
  background:transparent;
  border-radius:50%;
  cursor:grab;
  touch-action:none;
  z-index:10;
  -webkit-tap-highlight-color:transparent;
}

.portal.dragging {
  cursor:grabbing;
}

/* Only this is visible; its size is set from logo width in JS. */
.ball {
  position:absolute;
  left:50%;
  top:50%;
  width:12px;
  height:12px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:var(--accent);
  pointer-events:none;
  transition:box-shadow .15s ease;
}

.portal.dragging .ball {
  box-shadow:0 4px 10px rgba(143,63,176,.22);
}

.ball.speaking {
  animation:ball-say .46s ease-out 1;
}

@keyframes ball-say {
  0%, 100% {
    transform:translate(-50%,-50%);
  }
  28% {
    transform:translate(-50%,calc(-50% - 5px));
  }
  52% {
    transform:translate(-50%,-50%);
  }
  72% {
    transform:translate(-50%,calc(-50% - 2.5px));
  }
}

.ball.nudge-up {
  animation:ball-bounce-up .38s cubic-bezier(.2,.75,.35,1) 1;
}

.ball.waiting-long {
  background:#ed6e2e !important;
}

@keyframes ball-bounce-up {
  0%,100% { transform:translate(-50%,-50%); }
  45% { transform:translate(-50%,calc(-50% - 8px)); }
}




@media (prefers-reduced-motion: reduce) {
  .ball.nudge-up {
    animation:none;
  }
}

.speech {
  position:absolute;
  z-index:8;
  max-width:min(340px,78vw);
  color:#171512;
  font:400 clamp(14px,1.25vw,16px)/1.34 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-align:left;
  pointer-events:none;
  transition:opacity .18s ease;
}

.corner-label {
  position:absolute;
  color:var(--choice);
  font:400 clamp(13px,1.1vw,15px)/1.24 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:.01em;
  pointer-events:none;
  opacity:0;
  transition:opacity .18s ease;
  white-space:nowrap;
}

.corner-label.visible {
  opacity:1;
}

.construction {
  margin-top:2px;
  color:var(--muted);
  font:400 12px/1.4 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:.14em;
}

@media(max-width:640px) {
  .doorway { width:98vw; }
  .stage { min-height:230px; }
  .speech { font-size:14px; }
  .corner-label { font-size:13px; }
}
</style>
</head>

<script>
(() => {
  const stage = document.getElementById("stage");
  const logo = document.getElementById("logo");
  const portal = document.getElementById("portal");
  const ball = document.getElementById("ball");
  const speech = document.getElementById("speech");
  const labels = [
    document.getElementById("label-0"),
    document.getElementById("label-1"),
    document.getElementById("label-2")
  ];

  const logoDot = {
    x: 29.45088889 / 100,
    y: 24.92428571 / 100
  };

  const destinations = {
    yes: "https://hi.pilemma.org/",
    no: "https://en.wikipedia.org/wiki/Animal_cognition",
    maybe: "https://en.wikipedia.org/wiki/Human_intelligence"
  };

  let center = { x:0, y:0 };
  let pointerId = null;
  let down = null;
  let start = null;
  let moved = false;
  let instructionReady = false;
  let menuActive = false;
  let occupiedCorner = null;
  let choicesByCorner = {};

  let homeCenter = { x:0, y:0 };
  let waitingForRestart = false;
  let conversationTimers = [];
  let cornerPromptActive = false;
  let movedSinceCornerPrompt = false;

  let nudgeSwitchTimer = null;
  let longWaitActive = false;
  let orangeForever = false;
  let ignoreTimer = null;

  let conversationCount = 0;
  let dialogueStep = -1;
  let lastOccupiedCorner = 0;

  function stageRect() {
    return stage.getBoundingClientRect();
  }

  function corners() {
    const r = stageRect();
    const insetX = Math.max(34, r.width * .065);
    const insetY = Math.max(30, r.height * .12);

    return [
      { x:insetX,           y:insetY },            // TL
      { x:r.width-insetX,   y:insetY },            // TR
      { x:r.width-insetX,   y:r.height-insetY },   // BR
      { x:insetX,           y:r.height-insetY }    // BL
    ];
  }

  function setCenter(x, y) {
    center.x = x;
    center.y = y;
    portal.style.left = x + "px";
    portal.style.top = y + "px";

    // Intro lines travel with the little ball.
    // Once the corner question appears, it stays where it first appeared.
    if (!menuActive) {
      placeSpeech();
    }
  }

  function initialCenter() {
    const sr = stageRect();
    const lr = logo.getBoundingClientRect();

    const x = (lr.left - sr.left) + lr.width * logoDot.x;
    const y = (lr.top - sr.top) + lr.height * logoDot.y;

    homeCenter = { x, y };
    setCenter(x, y);

    /*
      Visible ball scales with the actual logo width, rather than viewport.
      It remains small visually; the 48px parent is the invisible hit area.
    */
    const visible = Math.max(13, Math.min(20, lr.width * .021));
    ball.style.width = visible + "px";
    ball.style.height = visible + "px";
  }

  function placeSpeech() {
    const sr = stageRect();
    const sw = speech.offsetWidth || 150;
    const sh = speech.offsetHeight || 20;

    let x = center.x - sw - 13;
    let y = center.y - sh - 11;

    x = Math.max(8, Math.min(sr.width - sw - 8, x));
    y = Math.max(8, Math.min(sr.height - sh - 8, y));

    speech.style.left = x + "px";
    speech.style.top = y + "px";
  }

  function setSpeech(text) {
    speech.textContent = text;
    speech.style.opacity = "1";
    requestAnimationFrame(placeSpeech);
  }

  function clearNudgeMotion() {
    if (nudgeSwitchTimer) {
      clearTimeout(nudgeSwitchTimer);
      nudgeSwitchTimer = null;
    }
    ball.classList.remove("nudge-up");
  }

  function startNudgeSequence() {
    clearNudgeMotion();

    const hop = () => {
      if (!cornerPromptActive || menuActive || longWaitActive || pointerId !== null) {
        return;
      }

      ball.classList.remove("nudge-up");
      void ball.offsetWidth;
      ball.classList.add("nudge-up");

      // One hop, then a short impatient pause.
      nudgeSwitchTimer = setTimeout(hop, 720);
    };

    hop();
  }

  function clearIgnoreTimer() {
    if (ignoreTimer) {
      clearTimeout(ignoreTimer);
      ignoreTimer = null;
    }
  }

  function stopWaitingBehavior({keepOrange = true} = {}) {
    clearNudgeMotion();
    clearIgnoreTimer();
    longWaitActive = false;
    ball.classList.remove("waiting-long");

    if (keepOrange && orangeForever) {
      ball.style.background = "#ed6e2e";
    } else if (!orangeForever) {
      ball.style.background = "";
    }
  }

  function beginLongWait() {
    clearNudgeMotion();
    clearIgnoreTimer();
    longWaitActive = true;
    orangeForever = true;
    ball.classList.add("waiting-long");
    ball.style.background = "#ed6e2e";

    // After being ignored, the ball stops moving and stops talking.
    speech.style.opacity = "0";
  }

  function beginWaitingBehavior() {
    clearIgnoreTimer();
    startNudgeSequence();

    ignoreTimer = setTimeout(() => {
      if (cornerPromptActive && !menuActive && pointerId === null) {
        beginLongWait();
      }
    }, 10000);
  }

  function nearestCorner(x, y) {
    const cs = corners();
    let best = null;

    cs.forEach((c, i) => {
      const d = Math.hypot(x-c.x, y-c.y);
      if (!best || d < best.distance) {
        best = { index:i, corner:c, distance:d };
      }
    });

    return best;
  }

  function snapThreshold() {
    const r = stageRect();
    return Math.max(42, Math.min(66, r.width * .075));
  }

  function hideLabels() {
    labels.forEach(el => {
      el.classList.remove("visible");
      el.textContent = "";
    });
  }

  function clearDialogueTimersOnly() {
    conversationTimers.forEach(id => clearTimeout(id));
    conversationTimers = [];
  }

  function clearConversationTimers() {
    clearDialogueTimersOnly();
    cornerPromptActive = false;
    movedSinceCornerPrompt = false;
    dialogueStep = -1;
  }

  const firstDialogue = [
    { text:"hi!", wait:2000 },
    { text:"i love the corners.", wait:3000 },
    { text:"very cozy!", wait:4000 },
    { text:"could you take me there?", wait:null }
  ];

  const returnDialogue = [
    { text:"hi!", wait:2000 },
    { text:"welcome back.", wait:2000 },
    { text:"still curious about human intelligence?", wait:null }
  ];

  function finishFirstDialogue() {
    clearDialogueTimersOnly();
    instructionReady = true;
    cornerPromptActive = true;
    movedSinceCornerPrompt = false;
    beginWaitingBehavior();
  }

  function showFirstDialogueStep(index) {
    clearDialogueTimersOnly();
    dialogueStep = Math.max(0, Math.min(index, firstDialogue.length - 1));

    const item = firstDialogue[dialogueStep];
    setSpeech(item.text);

    if (dialogueStep === firstDialogue.length - 1) {
      finishFirstDialogue();
      return;
    }

    conversationTimers.push(setTimeout(() => {
      showFirstDialogueStep(dialogueStep + 1);
    }, item.wait));
  }

  function showReturnDialogueStep(index) {
    clearDialogueTimersOnly();
    dialogueStep = Math.max(0, Math.min(index, returnDialogue.length - 1));

    const item = returnDialogue[dialogueStep];
    setSpeech(item.text);

    if (dialogueStep === returnDialogue.length - 1) {
      instructionReady = true;
      showRepeatMenu();
      return;
    }

    conversationTimers.push(setTimeout(() => {
      showReturnDialogueStep(dialogueStep + 1);
    }, item.wait));
  }

  function advanceDialogueByClick() {
    if (menuActive || instructionReady) return;

    if (conversationCount === 1) {
      // A click during the initial two-second silence reveals "hi!" immediately.
      if (dialogueStep < 0) {
        showFirstDialogueStep(0);
      } else {
        showFirstDialogueStep(dialogueStep + 1);
      }
    } else {
      if (dialogueStep < 0) {
        showReturnDialogueStep(0);
      } else {
        showReturnDialogueStep(dialogueStep + 1);
      }
    }
  }

  function interruptFirstDialogueForDrag() {
    if (conversationCount !== 1 || instructionReady || menuActive || waitingForRestart) {
      return;
    }

    clearDialogueTimersOnly();
    dialogueStep = firstDialogue.length - 1;
    setSpeech("take me to a corner.");
    instructionReady = true;
    cornerPromptActive = true;
    movedSinceCornerPrompt = false;
  }

  function startConversation() {
    stopWaitingBehavior({keepOrange:true});
    clearConversationTimers();

    waitingForRestart = false;
    instructionReady = false;
    speech.textContent = "";
    speech.style.opacity = "0";
    conversationCount += 1;
    dialogueStep = -1;

    if (conversationCount === 1) {
      // First impression: two quiet seconds before the ball says hello.
      conversationTimers.push(setTimeout(() => {
        showFirstDialogueStep(0);
      }, 2000));
    } else {
      // On return, the user's click already initiated the exchange.
      showReturnDialogueStep(0);
    }
  }

  function resetAtHome() {
    stopWaitingBehavior({keepOrange:true});
    clearConversationTimers();

    menuActive = false;
    cornerPromptActive = false;
    movedSinceCornerPrompt = false;
    occupiedCorner = null;
    choicesByCorner = {};
    instructionReady = false;
    waitingForRestart = true;

    hideLabels();
    speech.style.opacity = "0";
  }

  function nearHome(x, y) {
    const r = stageRect();
    const radius = Math.max(38, Math.min(56, r.width * .06));
    return Math.hypot(x - homeCenter.x, y - homeCenter.y) <= radius;
  }

  function positionChoiceLabel(el, cornerIndex, text) {
    const c = corners()[cornerIndex];

    el.textContent = text;
    el.dataset.choice = text;
    el.dataset.corner = String(cornerIndex);

    // Text sits just inward from each corner.
    const pad = 13;

    if (cornerIndex === 0) {
      el.style.left = (c.x + pad) + "px";
      el.style.top = (c.y + pad) + "px";
      el.style.transform = "none";
    } else if (cornerIndex === 1) {
      el.style.left = (c.x - pad) + "px";
      el.style.top = (c.y + pad) + "px";
      el.style.transform = "translateX(-100%)";
    } else if (cornerIndex === 2) {
      el.style.left = (c.x - pad) + "px";
      el.style.top = (c.y - pad) + "px";
      el.style.transform = "translate(-100%,-100%)";
    } else {
      el.style.left = (c.x + pad) + "px";
      el.style.top = (c.y - pad) + "px";
      el.style.transform = "translateY(-100%)";
    }

    el.classList.add("visible");
  }

  function showRepeatMenu() {
    stopWaitingBehavior({keepOrange:true});
    /*
      Recompute the ball's position relative to the invisible box NOW.
      The nearest corner is treated as the ball's current corner, and the
      other three corners receive yes / no / maybe.
    */
    const current = nearestCorner(center.x, center.y);
    const firstCorner = current ? current.index : 0;

    menuActive = true;
    cornerPromptActive = false;
    occupiedCorner = firstCorner;
    speech.style.opacity = "1";

    const clockwise = [0,1,2,3];
    const startIndex = clockwise.indexOf(firstCorner);
    const remaining = [];

    for (let step=1; step<=3; step++) {
      remaining.push(clockwise[(startIndex + step) % 4]);
    }

    const names = ["yes","no","maybe"];
    choicesByCorner = {};

    remaining.forEach((cornerIndex, i) => {
      const name = names[i];
      choicesByCorner[cornerIndex] = name;
      positionChoiceLabel(labels[i], cornerIndex, name);
    });
  }

  function activateMenu(firstCorner) {
    stopWaitingBehavior({keepOrange:true});
    menuActive = true;
    cornerPromptActive = false;
    occupiedCorner = firstCorner;
    lastOccupiedCorner = firstCorner;

    setSpeech("curious about human intelligence?");
    speech.style.opacity = "1";

    /*
      Walk clockwise from the occupied corner.
      The three remaining corners receive yes / no / maybe.
    */
    const clockwise = [0,1,2,3];
    const startIndex = clockwise.indexOf(firstCorner);
    const remaining = [];

    for (let step=1; step<=3; step++) {
      remaining.push(clockwise[(startIndex + step) % 4]);
    }

    const names = ["yes","no","maybe"];
    choicesByCorner = {};

    remaining.forEach((cornerIndex, i) => {
      const name = names[i];
      choicesByCorner[cornerIndex] = name;
      positionChoiceLabel(labels[i], cornerIndex, name);
    });
  }

  function begin(event) {
    event.preventDefault();

    pointerId = event.pointerId;
    down = { x:event.clientX, y:event.clientY };
    start = { ...center };
    moved = false;

    portal.classList.add("dragging");
    portal.setPointerCapture(pointerId);
  }

  function move(event) {
    if (event.pointerId !== pointerId) return;
    event.preventDefault();

    const dx = event.clientX - down.x;
    const dy = event.clientY - down.y;

    if (Math.hypot(dx,dy) > 4) {
      if (!moved) {
        moved = true;
        clearNudgeMotion();
        clearIgnoreTimer();

        if (!instructionReady && !menuActive) {
          interruptFirstDialogueForDrag();
        }
      }

      if (cornerPromptActive) {
        movedSinceCornerPrompt = true;
      }
    }

    const r = stageRect();
    const margin = 12;

    const x = Math.max(margin, Math.min(r.width-margin, start.x + dx));
    const y = Math.max(margin, Math.min(r.height-margin, start.y + dy));

    setCenter(x,y);
  }

  function end(event) {
    if (event.pointerId !== pointerId) return;
    event.preventDefault();

    try { portal.releasePointerCapture(pointerId); } catch (_) {}
    pointerId = null;
    portal.classList.remove("dragging");

    /*
      After the menu has appeared, bringing the ball back near its original
      i-dot position resets the doorway. It does not need pixel-perfect alignment.
    */
    if (moved && menuActive && nearHome(center.x, center.y)) {
      resetAtHome();
      return;
    }

    /*
      Once reset, a simple click on the ball begins the conversation again.
    */
    if (!moved) {
      if (waitingForRestart) {
        startConversation();
      } else if (!menuActive && !instructionReady) {
        advanceDialogueByClick();
      } else if (cornerPromptActive && !menuActive) {
        // A tap while the ball is waiting simply lets it resume hopping.
        beginWaitingBehavior();
      }
      return;
    }

    const hit = nearestCorner(center.x, center.y);
    if (!hit || hit.distance > snapThreshold()) {
      if (cornerPromptActive && !menuActive) {
        beginWaitingBehavior();
      }
      return;
    }

    /*
      Do NOT snap the ball to the corner.
      Releasing near a corner is enough to trigger the next step / destination,
      but the ball stays where the user left it.
    */
    if (!instructionReady) return;

    if (!menuActive) {
      ball.classList.remove("waiting-long", "nudge-up");
      if (orangeForever) {
        ball.style.background = "#ed6e2e";
      }
      activateMenu(hit.index);
      return;
    }

    const choice = choicesByCorner[hit.index];
    if (choice) {
      window.location.href = destinations[choice];
    }
  }

  portal.addEventListener("pointerdown", begin);
  portal.addEventListener("pointermove", move);
  portal.addEventListener("pointerup", end);
  portal.addEventListener("pointercancel", () => {
    pointerId = null;
    portal.classList.remove("dragging");
  });

  // Initial visit starts automatically. After a reset, clicking the ball restarts it.
  startConversation();

  window.addEventListener("resize", () => {
    if (!menuActive && !waitingForRestart && pointerId === null) {
      initialCenter();
    } else {
      const sr = stageRect();
      const lr = logo.getBoundingClientRect();

      homeCenter = {
        x: (lr.left - sr.left) + lr.width * logoDot.x,
        y: (lr.top - sr.top) + lr.height * logoDot.y
      };

      setCenter(
        Math.max(12, Math.min(sr.width-12, center.x)),
        Math.max(12, Math.min(sr.height-12, center.y))
      );

      if (menuActive) {
        const entries = Object.entries(choicesByCorner);
        entries.forEach(([cornerIndex, choice], i) => {
          positionChoiceLabel(labels[i], Number(cornerIndex), choice);
        });
      }
    }
  });

  requestAnimationFrame(initialCenter);
})();
</script>
</body>
</html>
